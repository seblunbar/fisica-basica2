<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Física básica en A-Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 1) A-Frame (el motor 3D/VR). Se usa la 1.7.1 porque es la que mejor
          se lleva con la librería de física. -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- 2) Motor de física (basado en Cannon.js). Agrega los componentes:
          static-body  → objeto fijo que no se mueve (piso, rampa, paredes)
          dynamic-body → objeto que tiene masa, cae y choca -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    /*
      COMPONENTE "filtros-colision"  (va en la <a-scene>)
      Decide quién choca con quién usando los "grupos de colisión" de Cannon.
        - Grupo 1: el mundo y el jugador (por defecto).
        - Grupo 2: las pelotas lanzadas.
      Las pelotas chocan con el mundo y entre ellas, pero NO con el jugador.
      (Cannon solo hace chocar a A y B si grupo(A) & máscara(B) y grupo(B) & máscara(A)).
    */
    AFRAME.registerComponent('filtros-colision', {
      init: function () {
        // "body-loaded" sube (burbujea) hasta la escena, así que lo escuchamos aquí
        this.el.addEventListener('body-loaded', (e) => {
          const body = e.target.body;
          if (!body) return;

          if (e.target.classList.contains('pelota')) {
            body.collisionFilterGroup = 2;   // soy una pelota lanzada
            body.collisionFilterMask  = 3;   // choco con grupo 1 (mundo) y 2 (otras pelotas)
          } else {
            body.collisionFilterGroup = 1;
            body.collisionFilterMask  = 0xFFFF;  // el resto choca con todo, pelotas incluidas
          }
        });
      }
    });

    /*
      COMPONENTE "gravedad-invertible"  (va en la <a-scene>)
      Tecla E (o botón A / X del Quest): invierte la gravedad.
    */
    AFRAME.registerComponent('gravedad-invertible', {
      schema: {
        g: { type: 'number', default: 9.8 }   // magnitud de la gravedad (m/s²)
      },

      init: function () {
        this.invertida = false;
        this.colorCielo = '#BFE3F2';
        this.toggle = this.toggle.bind(this);

        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyE' && !e.repeat) this.toggle();
        });
        // Controles del Quest (los eventos de los controles suben hasta la escena)
        this.el.addEventListener('abuttondown', this.toggle);
        this.el.addEventListener('xbuttondown', this.toggle);
      },

      toggle: function () {
        const driver = this.el.systems.physics && this.el.systems.physics.driver;
        if (!driver || !driver.world) return;

        this.invertida = !this.invertida;
        const gy = this.invertida ? this.data.g : -this.data.g;
        driver.world.gravity.set(0, gy, 0);

        // Despertar todos los cuerpos para que reaccionen al instante
        driver.world.bodies.forEach((b) => b.wakeUp());

        // Cambio de color del cielo para notar el estado
        const cielo = document.querySelector('a-sky');
        if (cielo) cielo.setAttribute('color', this.invertida ? '#E1BEE7' : '#BFE3F2');
      }
    });

    /*
      COMPONENTE "lanzador"
      Hace dos cosas (se pone en la cámara y en cada control del Quest):

      1) LANZAR una pelota nueva
         - Compu: tecla Q.   - Quest: botón lateral (grip).
      2) AGARRAR un objeto y AVENTARLO al soltarlo
         - Compu: mantener clic izquierdo apuntando al objeto, soltar clic para aventar.
         - Quest: mantener el gatillo, soltarlo para aventar.

      Cuando algo sale (pelota nueva o soltar un objeto agarrado) lleva:
        velocidad = (dirección * rapidez)            ← hacia donde se apunta
                  + velocidad lineal del lanzador    ← si el jugador se mueve
                  + (ω × brazo)                      ← si el lanzador está girando
      donde ω es la velocidad angular (rad/s) y "brazo" es la distancia a la que
      está el objeto (como una honda: mientras más lejos, más velocidad tangencial).
    */
    AFRAME.registerComponent('lanzador', {
      schema: {
        velocidad:  { type: 'number', default: 8 },    // m/s de las pelotas nuevas
        masa:       { type: 'number', default: 1 },    // kg
        maxPelotas: { type: 'int',    default: 25 },   // para no saturar el visor
        radioMin:   { type: 'number', default: 0.1 },  // m
        radioMax:   { type: 'number', default: 0.8 },  // m
        brazo:      { type: 'number', default: 1 },    // m (palanca para el giro al lanzar)
        maxExtra:   { type: 'number', default: 20 },   // tope de velocidad heredada (m/s)
        alcance:    { type: 'number', default: 8 },    // m: qué tan lejos puede agarrar
        impulso:    { type: 'number', default: 6 }     // m/s hacia donde se ve al soltar lo agarrado
      },

      init: function () {
        this.pelotas = [];
        this.lanzar  = this.lanzar.bind(this);
        this.agarrar = this.agarrar.bind(this);
        this.soltar  = this.soltar.bind(this);

        // Lo que tenemos agarrado ahora mismo
        this.agarrado = null;
        this.distAgarre = 1.5;     // distancia a la que se sostiene
        this.guardado = null;      // grupo de colisión original del objeto agarrado

        // Para medir cómo se mueve / gira el lanzador entre cuadros
        this.posPrev  = new THREE.Vector3();
        this.quatPrev = new THREE.Quaternion();
        this.velLineal   = new THREE.Vector3();   // m/s (suavizada)
        this.velAngular  = new THREE.Vector3();   // rad/s (suavizada)
        this.tienePrev = false;

        // Auxiliares (para no crear objetos nuevos cada cuadro)
        this._pos = new THREE.Vector3();
        this._quat = new THREE.Quaternion();
        this._dq = new THREE.Quaternion();
        this._vL = new THREE.Vector3();
        this._w = new THREE.Vector3();
        this._dir = new THREE.Vector3();
        this._objetivo = new THREE.Vector3();
        this._tiron = new THREE.Vector3();

        // Controles de teclado y mouse (solo tiene sentido en la cámara)
        if (this.el.hasAttribute('camera')) {
          window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.code === 'KeyQ') this.lanzar();     // Q = pelota nueva
            if (e.code === 'KeyR') location.reload(); // R = reiniciar escena
          });
          
          window.addEventListener('mousedown', (e) => {
            if (e.button === 0) this.agarrar();       // Clic izquierdo (0) = agarrar
          });
          
          window.addEventListener('mouseup', (e) => {
            if (e.button === 0) this.soltar();        // Soltar clic = aventar
          });
        }
        
        // Controles del Quest
        this.el.addEventListener('triggerdown', this.agarrar);  // Gatillo = agarrar
        this.el.addEventListener('triggerup',   this.soltar);   // Soltar gatillo = aventar
        this.el.addEventListener('gripdown',    this.lanzar);   // Grip (botón lateral) = pelota nueva
      },

      /* Cada cuadro medimos la velocidad lineal y angular del lanzador
         y, si hay algo agarrado, lo jalamos hacia la mano */
      tick: function (time, delta) {
        if (!delta) return;
        const dt = delta / 1000;

        const obj = this.el.object3D;
        obj.getWorldPosition(this._pos);
        obj.getWorldQuaternion(this._quat);

        if (this.tienePrev && dt < 0.1) {   // si hubo un tirón (pestaña en pausa) lo ignoramos
          // Velocidad lineal = Δposición / Δt
          this._vL.copy(this._pos).sub(this.posPrev).divideScalar(dt);

          // Velocidad angular: rotación entre cuadros (en marco del mundo)
          // dq = q_ahora * q_antes⁻¹  →  eje y ángulo  →  ω = eje * ángulo / Δt
          this._dq.copy(this.quatPrev).invert().premultiply(this._quat);
          if (this._dq.w < 0) {   // tomar el camino corto
            this._dq.x *= -1; this._dq.y *= -1; this._dq.z *= -1; this._dq.w *= -1;
          }
          const angulo = 2 * Math.acos(Math.min(1, this._dq.w));
          const s = Math.sqrt(1 - this._dq.w * this._dq.w);
          if (s < 1e-6) {
            this._w.set(0, 0, 0);
          } else {
            this._w.set(this._dq.x / s, this._dq.y / s, this._dq.z / s)
                   .multiplyScalar(angulo / dt);
          }

          // Suavizado exponencial (evita que un cuadro "raro" dispare la pelota)
          const a = 1 - Math.exp(-dt / 0.08);
          this.velLineal.lerp(this._vL, a);
          this.velAngular.lerp(this._w, a);
        }

        this.posPrev.copy(this._pos);
        this.quatPrev.copy(this._quat);
        this.tienePrev = true;

        // ---- Sostener el objeto agarrado ----
        if (this.agarrado) {
          const el = this.agarrado;
          const body = el.body;
          if (!body || !el.parentNode) {      // lo borraron o aún no tiene cuerpo
            this.agarrado = null;
            return;
          }
          // Punto frente a la mano donde debe quedar el objeto
          obj.getWorldDirection(this._dir).negate();
          this._objetivo.copy(this._pos).addScaledVector(this._dir, this.distAgarre);

          // Velocidad que lo lleva hacia ese punto (así sigue chocando con paredes y piso)
          const p = body.position;
          this._tiron.set(this._objetivo.x - p.x, this._objetivo.y - p.y, this._objetivo.z - p.z)
                     .multiplyScalar(18).clampLength(0, 40);
          body.velocity.set(this._tiron.x, this._tiron.y, this._tiron.z);
          body.angularVelocity.set(0, 0, 0);
          body.wakeUp();
        }
      },

      /* Velocidad de salida = hacia donde se apunta + movimiento + giro */
      velocidadSalida: function (rapidez, brazo, dir) {
        const v = dir.clone().multiplyScalar(rapidez);

        // lo que ya se mueve el lanzador (caminar, mover el control...)
        const extra = this.velLineal.clone();

        // por el giro: v_tangencial = ω × r   (r = vector del lanzador al objeto)
        extra.add(this.velAngular.clone().cross(dir.clone().multiplyScalar(brazo)));

        extra.clampLength(0, this.data.maxExtra);
        return v.add(extra);
      },

      /* Busca el objeto dinámico al que se está apuntando (el más cercano) */
      buscarObjetivo: function () {
        const obj = this.el.object3D;
        const origen = new THREE.Vector3();
        const dir = new THREE.Vector3();
        obj.getWorldPosition(origen);
        obj.getWorldDirection(dir).negate();
        const rayo = new THREE.Ray(origen, dir);

        const caja = new THREE.Box3();
        const esfera = new THREE.Sphere();
        const punto = new THREE.Vector3();
        let mejor = null, mejorDist = this.data.alcance, mejorRadio = 0.3;

        document.querySelectorAll('[dynamic-body]').forEach((el) => {
          if (el.id === 'rig' || !el.body) return;       // el jugador no se agarra a sí mismo
          caja.setFromObject(el.object3D);
          caja.getBoundingSphere(esfera);
          const radio = esfera.radius;
          esfera.radius += 0.25;                         // un poco de tolerancia al apuntar
          if (!rayo.intersectSphere(esfera, punto)) return;
          const d = origen.distanceTo(esfera.center);
          if (d < mejorDist) { mejor = el; mejorDist = d; mejorRadio = radio; }
        });

        if (!mejor) return null;
        return { el: mejor, dist: mejorDist, radio: mejorRadio };
      },

      agarrar: function () {
        if (this.agarrado) return;
        const objetivo = this.buscarObjetivo();
        if (!objetivo) return;

        const el = objetivo.el;
        this.agarrado = el;
        // Lo sostenemos a la distancia a la que estaba (ni pegado ni muy lejos)
        this.distAgarre = Math.min(6, Math.max(objetivo.dist, objetivo.radio + 0.8));

        // Mientras se sostiene, no choca con el jugador (grupo 2, como las pelotas)
        const body = el.body;
        this.guardado = { grupo: body.collisionFilterGroup, mascara: body.collisionFilterMask };
        body.collisionFilterGroup = 2;
        body.collisionFilterMask  = 3;

        // Brillito para saber que está agarrado
        el.setAttribute('material', 'emissive', '#ffffff');
        el.setAttribute('material', 'emissiveIntensity', 0.35);
      },

      soltar: function () {
        const el = this.agarrado;
        if (!el) return;
        this.agarrado = null;

        const body = el.body;
        if (body) {
          // ¡Aventar! Misma fórmula: dirección + movimiento + giro
          const dir = new THREE.Vector3();
          this.el.object3D.getWorldDirection(dir).negate();
          const v = this.velocidadSalida(this.data.impulso, this.distAgarre, dir);
          body.velocity.set(v.x, v.y, v.z);
          body.wakeUp();

          // Regresar a su grupo de colisión original
          if (this.guardado) {
            body.collisionFilterGroup = this.guardado.grupo;
            body.collisionFilterMask  = this.guardado.mascara;
          }
        }
        this.guardado = null;
        el.setAttribute('material', 'emissiveIntensity', 0);
      },

      lanzar: function () {
        const obj = this.el.object3D;

        // Posición y dirección del lanzador en el mundo
        const origen = new THREE.Vector3();
        const dir = new THREE.Vector3();
        obj.getWorldPosition(origen);
        obj.getWorldDirection(dir).negate();   // en A-Frame "al frente" es -Z

        const inicio = origen.clone().add(dir.clone().multiplyScalar(0.5));

        // Crear la pelota (con color vivo y aleatorio)
        const pelota = document.createElement('a-sphere');
        const radius = this.data.radioMin + Math.random() * (this.data.radioMax - this.data.radioMin);
        const tono = Math.floor(Math.random() * 360);
        pelota.classList.add('pelota');   // "filtros-colision" usa esta clase
        pelota.setAttribute('radius', radius);
        pelota.setAttribute('color', `hsl(${tono}, 85%, 55%)`);
        pelota.setAttribute('position', { x: inicio.x, y: inicio.y, z: inicio.z });
        pelota.setAttribute('dynamic-body', `mass: ${this.data.masa}; shape: sphere; sphereRadius: ${radius}`);

        // Velocidad inicial: hacia donde se apunta + movimiento + giro
        const v = this.velocidadSalida(this.data.velocidad, this.data.brazo, dir);

        // Cuando el cuerpo físico ya existe, le damos la velocidad inicial
        pelota.addEventListener('body-loaded', () => {
          pelota.body.velocity.set(v.x, v.y, v.z);
        });

        this.el.sceneEl.appendChild(pelota);

        // Borrar las pelotas más viejas
        this.pelotas.push(pelota);
        if (this.pelotas.length > this.data.maxPelotas) {
          const vieja = this.pelotas.shift();
          vieja.parentNode && vieja.parentNode.removeChild(vieja);
        }
      }
    });

    /*
      COMPONENTE "reporte-choque"
      Cambia de color al objeto cuando algo lo golpea.
      Sirve para explicar el evento "collide" en clase.
    */
    AFRAME.registerComponent('reporte-choque', {
      init: function () {
        this.el.addEventListener('collide', () => {
          this.el.setAttribute('color', '#FF5252');
        });
      }
    });

    /*
      COMPONENTE "jugador-fisico"
      Mueve al jugador con WASD usando FÍSICA (velocidad), no teletransportando.
      Así choca con paredes (static-body) y empuja cajas (dynamic-body).
    */
    AFRAME.registerComponent('jugador-fisico', {
      schema: {
        velocidad: { type: 'number', default: 8 }   // m/s
      },

      init: function () {
        this.teclas = {};
        window.addEventListener('keydown', (e) => this.teclas[e.code] = true);
        window.addEventListener('keyup',   (e) => this.teclas[e.code] = false);

        this.camara = this.el.querySelector('[camera]');

        // Que el cuerpo no ruede como pelota
        this.el.addEventListener('body-loaded', () => {
          this.el.body.fixedRotation = true;
          this.el.body.updateMassProperties();
        });
      },

      tick: function () {
        const body = this.el.body;
        if (!body) return;

        let x = 0, z = 0;
        if (this.teclas.KeyW) z -= 1;
        if (this.teclas.KeyS) z += 1;
        if (this.teclas.KeyA) x -= 1;
        if (this.teclas.KeyD) x += 1;

        // Girar la dirección según hacia dónde mira la cámara
        const yaw = this.camara.object3D.rotation.y;
        const v = new THREE.Vector3(x, 0, z).normalize()
          .multiplyScalar(this.data.velocidad)
          .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        body.wakeUp();
        body.velocity.x = v.x;
        body.velocity.z = v.z;   // la Y la sigue controlando la gravedad
      }
    });
  </script>
</head>

<body>
  <!--
    physics: configura el "mundo físico"
      gravity     → aceleración en Y (m/s²). Prueben -1.62 (Luna) o -24.8 (Júpiter).
      restitution → qué tanto rebotan las cosas (0 = nada, 1 = rebote perfecto).
      friction    → fricción entre superficies.
      debug: true → dibuja en alambre la forma física de cada objeto.
    filtros-colision   → las pelotas lanzadas no chocan con el jugador.
    gravedad-invertible → tecla E (o A/X en el Quest) invierte la gravedad.
  -->
  <a-scene physics="gravity: -9.8; restitution: 0.4; friction: 0.1; debug: false"
           filtros-colision
           gravedad-invertible="g: 9.8">

    <!-- Ambiente -->
    <a-sky color="#BFE3F2"></a-sky>
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="directional" intensity="0.8" position="2 4 2"></a-light>

    <!-- PISO: estático. Se usa una caja delgada (más estable que un plano). -->
    <a-box static-body position="0 -0.05 0" width="20" height="0.1" depth="20" color="#7BC8A4"></a-box>

    <!-- TECHO: con la gravedad invertida todo "cae" hacia arriba; esto lo detiene a 30 m.
         Semitransparente para que se note. -->
    <a-box static-body position="0 30.05 0" width="20" height="0.1" depth="20"
           color="#B39DDB" opacity="0.35" transparent="true"></a-box>

    <!-- RAMPA: estática e inclinada 20° -->
    <a-box static-body position="-3 0.6 -4" rotation="0 0 -20" width="4" height="0.1" depth="1.5" color="#8D6E63"></a-box>

    <!-- Pelota que rueda por la rampa (dinámica) -->
    <a-sphere dynamic-body="mass: 2" position="-4.5 2.5 -4" radius="0.3" color="#FFC65D"></a-sphere>

    <!-- TORRE de cajas dinámicas: blanco para las pelotas -->
    <a-box dynamic-body="mass: 1" reporte-choque position="2 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2 0.75 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2 1.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2.5 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2.5 0.75 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>

    <!-- Caída libre: dos esferas de distinta masa, misma altura.
         ¿Cuál llega primero? (Galileo dice: las dos al mismo tiempo) -->
    <a-sphere dynamic-body="mass: 1"  position="0 20 -6" radius="0.25" color="#EF2D5E"></a-sphere>
    <a-sphere dynamic-body="mass: 20" position="1 20 -6" radius="0.25" color="#5E35B1"></a-sphere>

    <!-- Instrucciones -->
    <a-text value="Q / grip: lanzar pelota    Clic izq / gatillo: agarrar, soltar para aventar    E: gravedad    R: reiniciar    WASD: moverse"
            position="-4.5 3.2 -6" color="#222" width="9"></a-text>

    <!-- PARED: estática, el jugador no la puede atravesar -->
    <a-box static-body position="-2 1 0" width="0.2" height="2" depth="4" color="#999"></a-box>

    <!-- JUGADOR: cuerpo físico (esfera invisible de 0.4 m en los pies).
         Masa 60 kg → empuja fácil las cajas de 1 kg. -->
    <a-entity id="rig" position="0 0.4 3"
              dynamic-body="mass: 60; shape: sphere; sphereRadius: 0.4"
              jugador-fisico="velocidad: 4">
      <!-- Cámara SIN wasd-controls (si no, atraviesa todo).
           En la compu: Q lanza una pelota, clic izquierdo (mantener) agarra y al soltar se aventa.
           La miranda (anillo) ayuda a apuntar. -->
      <a-entity camera look-controls position="0 1.2 0"
                lanzador="velocidad: 10; masa: 1">
        <a-ring position="0 0 -1" radius-inner="0.008" radius-outer="0.014"
                material="shader: flat; color: #ffffff; opacity: 0.7"></a-ring>
      </a-entity>

      <!-- Controles del Quest: grip = pelota nueva, gatillo (mantener) = agarrar y aventar
           (A / X invierten la gravedad) -->
      <a-entity laser-controls="hand: right" lanzador="velocidad: 10"></a-entity>
      <a-entity laser-controls="hand: left"  lanzador="velocidad: 10"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
