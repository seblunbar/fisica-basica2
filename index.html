<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Física básica en A-Frame</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- A-Frame (1.7.1) -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <!-- Cannon.js Physics -->
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>

  <script>
    AFRAME.registerComponent('filtros-colision', {
      init: function () {
        this.el.addEventListener('body-loaded', (e) => {
          const body = e.target.body;
          if (!body) return;
          if (e.target.classList.contains('pelota')) {
            body.collisionFilterGroup = 2;
            body.collisionFilterMask  = 3;
          } else {
            body.collisionFilterGroup = 1;
            body.collisionFilterMask  = 0xFFFF;
          }
        });
      }
    });

    AFRAME.registerComponent('gravedad-invertible', {
      schema: { g: { type: 'number', default: 9.8 } },
      init: function () {
        this.invertida = false;
        this.toggle = this.toggle.bind(this);
        window.addEventListener('keydown', (e) => {
          if (e.code === 'KeyE' && !e.repeat) this.toggle();
        });
        this.el.addEventListener('abuttondown', this.toggle);
        this.el.addEventListener('xbuttondown', this.toggle);
      },
      toggle: function () {
        const driver = this.el.systems.physics && this.el.systems.physics.driver;
        if (!driver || !driver.world) return;
        this.invertida = !this.invertida;
        const gy = this.invertida ? this.data.g : -this.data.g;
        driver.world.gravity.set(0, gy, 0);
        driver.world.bodies.forEach((b) => b.wakeUp());
        const cielo = document.querySelector('a-sky');
        if (cielo) cielo.setAttribute('color', this.invertida ? '#E1BEE7' : '#BFE3F2');
      }
    });

    AFRAME.registerComponent('lanzador', {
      schema: {
        velocidad:  { type: 'number', default: 8 },
        masa:       { type: 'number', default: 1 },
        maxPelotas: { type: 'int',    default: 25 },
        radioMin:   { type: 'number', default: 0.1 },
        radioMax:   { type: 'number', default: 0.8 },
        brazo:      { type: 'number', default: 1 },
        maxExtra:   { type: 'number', default: 20 },
        alcance:    { type: 'number', default: 8 },
        impulso:    { type: 'number', default: 6 }
      },

      init: function () {
        this.pelotas = [];
        this.lanzar  = this.lanzar.bind(this);
        this.agarrar = this.agarrar.bind(this);
        this.soltar  = this.soltar.bind(this);

        this.agarrado = null;
        this.distAgarre = 1.5;
        this.guardado = null;

        this.posPrev  = new THREE.Vector3();
        this.quatPrev = new THREE.Quaternion();
        this.velLineal   = new THREE.Vector3();
        this.velAngular  = new THREE.Vector3();
        this.tienePrev = false;

        this._pos = new THREE.Vector3();
        this._quat = new THREE.Quaternion();
        this._dq = new THREE.Quaternion();
        this._vL = new THREE.Vector3();
        this._w = new THREE.Vector3();
        this._dir = new THREE.Vector3();
        this._objetivo = new THREE.Vector3();
        this._tiron = new THREE.Vector3();

        if (this.el.hasAttribute('camera')) {
          window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.code === 'KeyQ') this.lanzar();
            if (e.code === 'KeyR') location.reload();
          });
          window.addEventListener('mousedown', (e) => {
            if (e.button === 0) this.agarrar();
          });
          window.addEventListener('mouseup', (e) => {
            if (e.button === 0) this.soltar();
          });
        }
        
        this.el.addEventListener('triggerdown', this.agarrar);
        this.el.addEventListener('triggerup',   this.soltar);
        this.el.addEventListener('gripdown',    this.lanzar);
      },

      tick: function (time, delta) {
        if (!delta) return;
        const dt = delta / 1000;

        const obj = this.el.object3D;
        obj.getWorldPosition(this._pos);
        obj.getWorldQuaternion(this._quat);

        if (this.tienePrev && dt < 0.1) {
          this._vL.copy(this._pos).sub(this.posPrev).divideScalar(dt);

          this._dq.copy(this.quatPrev).invert().premultiply(this._quat);
          if (this._dq.w < 0) {
            this._dq.x *= -1; this._dq.y *= -1; this._dq.z *= -1; this._dq.w *= -1;
          }
          
          // === SOLUCIÓN PANTALLA BLANCA ===
          // Prevenir que el valor w supere el límite de 1 por decimales falsos (evita que la raíz cuadrada lance NaN)
          const wSeguro = Math.min(1, Math.max(-1, this._dq.w));
          const angulo = 2 * Math.acos(wSeguro);
          const s = Math.sqrt(Math.max(0, 1 - wSeguro * wSeguro));

          if (s < 1e-6) {
            this._w.set(0, 0, 0);
          } else {
            this._w.set(this._dq.x / s, this._dq.y / s, this._dq.z / s).multiplyScalar(angulo / dt);
          }

          const a = 1 - Math.exp(-dt / 0.08);
          this.velLineal.lerp(this._vL, a);
          this.velAngular.lerp(this._w, a);
        }

        this.posPrev.copy(this._pos);
        this.quatPrev.copy(this._quat);
        this.tienePrev = true;

        if (this.agarrado) {
          const el = this.agarrado;
          const body = el.body;
          if (!body || !el.parentNode) {
            this.agarrado = null;
            return;
          }
          obj.getWorldDirection(this._dir).negate();
          this._objetivo.copy(this._pos).addScaledVector(this._dir, this.distAgarre);

          const p = body.position;
          this._tiron.set(this._objetivo.x - p.x, this._objetivo.y - p.y, this._objetivo.z - p.z)
                     .multiplyScalar(18).clampLength(0, 40);
          body.velocity.set(this._tiron.x, this._tiron.y, this._tiron.z);
          body.angularVelocity.set(0, 0, 0);
          body.wakeUp();
        }
      },

      velocidadSalida: function (rapidez, brazo, dir) {
        const v = dir.clone().multiplyScalar(rapidez);
        const extra = this.velLineal.clone();
        extra.add(this.velAngular.clone().cross(dir.clone().multiplyScalar(brazo)));
        extra.clampLength(0, this.data.maxExtra);
        v.add(extra);
        
        // Seguro anti-errores por si falla la matemática de la escena
        if (isNaN(v.x) || isNaN(v.y) || isNaN(v.z)) {
          v.set(0, 0, 0);
        }
        return v;
      },

      buscarObjetivo: function () {
        const obj = this.el.object3D;
        const origen = new THREE.Vector3();
        const dir = new THREE.Vector3();
        obj.getWorldPosition(origen);
        obj.getWorldDirection(dir).negate();
        const rayo = new THREE.Ray(origen, dir);

        const caja = new THREE.Box3();
        const esfera = new THREE.Sphere();
        const punto = new THREE.Vector3();
        let mejor = null, mejorDist = this.data.alcance, mejorRadio = 0.3;

        document.querySelectorAll('[dynamic-body]').forEach((el) => {
          if (el.id === 'rig' || !el.body) return;
          caja.setFromObject(el.object3D);
          caja.getBoundingSphere(esfera);
          const radio = esfera.radius;
          esfera.radius += 0.25;
          if (!rayo.intersectSphere(esfera, punto)) return;
          const d = origen.distanceTo(esfera.center);
          if (d < mejorDist) { mejor = el; mejorDist = d; mejorRadio = radio; }
        });

        if (!mejor) return null;
        return { el: mejor, dist: mejorDist, radio: mejorRadio };
      },

      agarrar: function () {
        if (this.agarrado) return;
        const objetivo = this.buscarObjetivo();
        if (!objetivo) return;

        const el = objetivo.el;
        this.agarrado = el;
        this.distAgarre = Math.min(6, Math.max(objetivo.dist, objetivo.radio + 0.8));

        const body = el.body;
        this.guardado = { grupo: body.collisionFilterGroup, mascara: body.collisionFilterMask };
        body.collisionFilterGroup = 2;
        body.collisionFilterMask  = 3;

        el.setAttribute('material', 'emissive', '#ffffff');
        el.setAttribute('material', 'emissiveIntensity', 0.35);
      },

      soltar: function () {
        const el = this.agarrado;
        if (!el) return;
        this.agarrado = null;

        const body = el.body;
        if (body) {
          const dir = new THREE.Vector3();
          this.el.object3D.getWorldDirection(dir).negate();
          const v = this.velocidadSalida(this.data.impulso, this.distAgarre, dir);
          body.velocity.set(v.x, v.y, v.z);
          body.wakeUp();

          if (this.guardado) {
            body.collisionFilterGroup = this.guardado.grupo;
            body.collisionFilterMask  = this.guardado.mascara;
          }
        }
        this.guardado = null;
        el.setAttribute('material', 'emissiveIntensity', 0);
      },

      lanzar: function () {
        const obj = this.el.object3D;
        const origen = new THREE.Vector3();
        const dir = new THREE.Vector3();
        obj.getWorldPosition(origen);
        obj.getWorldDirection(dir).negate();

        const inicio = origen.clone().add(dir.clone().multiplyScalar(0.5));

        const pelota = document.createElement('a-sphere');
        const radius = this.data.radioMin + Math.random() * (this.data.radioMax - this.data.radioMin);
        const tono = Math.floor(Math.random() * 360);
        pelota.classList.add('pelota');
        pelota.setAttribute('radius', radius);
        pelota.setAttribute('color', `hsl(${tono}, 85%, 55%)`);
        pelota.setAttribute('position', { x: inicio.x, y: inicio.y, z: inicio.z });
        pelota.setAttribute('dynamic-body', `mass: ${this.data.masa}; shape: sphere; sphereRadius: ${radius}`);

        const v = this.velocidadSalida(this.data.velocidad, this.data.brazo, dir);

        pelota.addEventListener('body-loaded', () => {
          pelota.body.velocity.set(v.x, v.y, v.z);
        });

        this.el.sceneEl.appendChild(pelota);

        this.pelotas.push(pelota);
        if (this.pelotas.length > this.data.maxPelotas) {
          const vieja = this.pelotas.shift();
          vieja.parentNode && vieja.parentNode.removeChild(vieja);
        }
      }
    });

    AFRAME.registerComponent('reporte-choque', {
      init: function () {
        this.el.addEventListener('collide', () => {
          this.el.setAttribute('color', '#FF5252');
        });
      }
    });

    AFRAME.registerComponent('jugador-fisico', {
      schema: { velocidad: { type: 'number', default: 8 } },
      init: function () {
        this.teclas = {};
        window.addEventListener('keydown', (e) => this.teclas[e.code] = true);
        window.addEventListener('keyup',   (e) => this.teclas[e.code] = false);

        this.camara = this.el.querySelector('[camera]');
        this.el.addEventListener('body-loaded', () => {
          this.el.body.fixedRotation = true;
          this.el.body.updateMassProperties();
        });
      },
      tick: function () {
        const body = this.el.body;
        if (!body) return;

        let x = 0, z = 0;
        if (this.teclas.KeyW) z -= 1;
        if (this.teclas.KeyS) z += 1;
        if (this.teclas.KeyA) x -= 1;
        if (this.teclas.KeyD) x += 1;

        const yaw = this.camara.object3D.rotation.y;
        const v = new THREE.Vector3(x, 0, z).normalize()
          .multiplyScalar(this.data.velocidad)
          .applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

        body.wakeUp();
        body.velocity.x = v.x;
        body.velocity.z = v.z;
      }
    });
  </script>
</head>

<body>
  <a-scene physics="gravity: -9.8; restitution: 0.4; friction: 0.1; debug: false"
           filtros-colision
           gravedad-invertible="g: 9.8">

    <a-sky color="#BFE3F2"></a-sky>
    <a-light type="ambient" intensity="0.6"></a-light>
    <a-light type="directional" intensity="0.8" position="2 4 2"></a-light>

    <a-box static-body position="0 -0.05 0" width="20" height="0.1" depth="20" color="#7BC8A4"></a-box>

    <a-box static-body position="0 30.05 0" width="20" height="0.1" depth="20"
           color="#B39DDB" opacity="0.35" transparent="true"></a-box>

    <a-box static-body position="-3 0.6 -4" rotation="0 0 -20" width="4" height="0.1" depth="1.5" color="#8D6E63"></a-box>

    <a-sphere dynamic-body="mass: 2" position="-4.5 2.5 -4" radius="0.3" color="#FFC65D"></a-sphere>

    <a-box dynamic-body="mass: 1" reporte-choque position="2 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2 0.75 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2 1.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2.5 0.25 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>
    <a-box dynamic-body="mass: 1" reporte-choque position="2.5 0.75 -5" width="0.5" height="0.5" depth="0.5" color="#4CC3D9"></a-box>

    <a-sphere dynamic-body="mass: 1"  position="0 20 -6" radius="0.25" color="#EF2D5E"></a-sphere>
    <a-sphere dynamic-body="mass: 20" position="1 20 -6" radius="0.25" color="#5E35B1"></a-sphere>

    <a-text value="Q / grip: lanzar pelota    Clic izq / gatillo: agarrar, soltar para aventar    E: gravedad    R: reiniciar    WASD: moverse"
            position="-4.5 3.2 -6" color="#222" width="9"></a-text>

    <a-box static-body position="-2 1 0" width="0.2" height="2" depth="4" color="#999"></a-box>

    <a-entity id="rig" position="0 0.4 3"
              dynamic-body="mass: 60; shape: sphere; sphereRadius: 0.4"
              jugador-fisico="velocidad: 4">
      <a-entity camera look-controls position="0 1.2 0"
                lanzador="velocidad: 10; masa: 1">
        <a-ring position="0 0 -1" radius-inner="0.008" radius-outer="0.014"
                material="shader: flat; color: #ffffff; opacity: 0.7"></a-ring>
      </a-entity>

      <a-entity laser-controls="hand: right" lanzador="velocidad: 10"></a-entity>
      <a-entity laser-controls="hand: left"  lanzador="velocidad: 10"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
